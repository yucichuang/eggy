<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>倉庫點清</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 手機一欄：選位置 → 這一層已記的東西 → 新增一樣 → 底部固定的狀態列 */
:root {
  --bg: #f4f2ee; --surface: #ffffff; --ink: #191414; --muted: #6f6a6a; --line: #e3e0e0; --soft: #efeded;
  --kb: #4100f5; --cit: #cdf564; --aq: #9bf0e1; --fu: #f037a5; --ta: #ff4632; --on-kb: #ffffff;
  --go1: #e4f7c2; --go2: #ffe1ef; --go3: #ffd9d3;
  --f-num: "Outfit", "Noto Sans TC", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141212; --surface: #1f1c1c; --ink: #f1eeee; --muted: #a9a3a3; --line: #353030; --soft: #2a2626;
  --kb: #8f73ff; --on-kb: #141212; --go1: #34401f; --go2: #4a2638; --go3: #4d2620; color-scheme: dark } }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; margin: 0; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 24px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
h1 { font-size: clamp(26px, 6vw, 34px); font-weight: 900; line-height: 1.25; margin: 0; }
h2 { font-size: 19px; font-weight: 900; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.box { background: var(--surface); border-radius: 18px; padding: 14px 16px; display: grid; gap: 10px; }
.grp { display: grid; gap: 6px; }
.grp b { font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--soft); color: var(--ink); font: inherit; font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 99px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.chip small { font-family: var(--f-num); font-size: 12px; color: var(--muted); font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .7; }
.chip:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--kb); outline-offset: 2px; }
.shelf-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.shelf-h small { color: var(--muted); font-weight: 700; }
.list { display: grid; gap: 8px; }
.item { background: var(--surface); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; border-left: 6px solid var(--line); }
.item.k1 { border-left-color: var(--cit); } .item.k2 { border-left-color: var(--aq); } .item.k3 { border-left-color: var(--ta); } .item.k4 { border-left-color: var(--fu); } .item.k5 { border-left-color: var(--kb); }
.item-t { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.bag { font-family: var(--f-num); font-weight: 800; font-size: 12.5px; background: var(--soft); border-radius: 8px; padding: 1px 8px; }
.item-t b { font-size: 16px; }
.item-t span.s { color: var(--muted); font-size: 13.5px; }
.meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.meta em { font-style: normal; font-family: var(--f-num); font-weight: 800; color: var(--ink); font-size: 15px; }
.go { display: flex; gap: 6px; flex-wrap: wrap; }
.gobox { background: #191414; color: #fff; border-radius: 18px; padding: 12px; display: grid; gap: 10px; }
.gobox.ok { background: var(--soft); color: var(--ink); }
.gl { font-family: var(--f-num); font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--cit); display: flex; justify-content: space-between; align-items: baseline; }
.gl small { font-family: var(--f-body); letter-spacing: 0; font-size: 12.5px; font-weight: 700; color: rgba(255,255,255,.7); }
.gobox.ok .gl { color: var(--muted); }
.gobox.ok .gl small { color: var(--muted); }
.gobox .go { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.go .chip { font-size: 14.5px; font-weight: 800; padding: 10px 4px; border: 0; border-radius: 99px; justify-content: center; white-space: nowrap; background: rgba(255,255,255,.12); color: #fff; }
.gobox.ok .go .chip { background: var(--surface); color: var(--muted); }
.go .chip[aria-pressed="true"][data-v="數量對"] { background: var(--cit); color: #191414; }
.go .chip[aria-pressed="true"][data-v="數量不對"] { background: var(--aq); color: #191414; }
.go .chip[aria-pressed="true"][data-v="找不到"] { background: var(--ta); color: #fff; }
.go .chip[aria-pressed="true"][data-v="壞掉"] { background: var(--fu); color: #fff; }
.del { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; justify-self: end; padding: 0 4px; }
.field { display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
input { font: inherit; font-size: 16px; color: var(--ink); background: var(--soft); border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 11px; min-width: 0; width: 100%; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.g3 { display: grid; grid-template-columns: 0.8fr 1fr 1fr; gap: 8px; }
.btn { border: 0; background: var(--kb); color: var(--on-kb); font: inherit; font-weight: 800; font-size: 16px; padding: 12px 20px; border-radius: 99px; cursor: pointer; }
.btn:disabled { opacity: .45; cursor: default; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--bg); padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13.5px; }
.bar b { font-family: var(--f-num); font-size: 16px; }
.bar button { border: 0; background: var(--cit); color: #191414; font: inherit; font-weight: 800; font-size: 13.5px; padding: 7px 14px; border-radius: 99px; cursor: pointer; }
.dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; background: #9ed36a; margin-right: 6px; }
.dot.off { background: var(--ta); }
.toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: var(--kb); color: var(--on-kb); padding: 10px 18px; border-radius: 99px; font-weight: 700; font-size: 14px; z-index: 9; }
.warn { background: var(--go3); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
@media (max-width: 380px) { .g3 { grid-template-columns: 1fr 1fr; } }
.cats { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.cats .cl { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-right: 2px; }
.cats .chip { font-size: 12.5px; padding: 3px 9px; }
.cats .chip[aria-pressed="true"] { background: var(--kb); border-color: var(--kb); color: var(--on-kb); }
.nobc { background: var(--cit); color: #191414; border-radius: 12px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 13.5px; }
.nobc .chip { flex: none; font-size: 13px; padding: 4px 10px; background: #fff; color: #191414; }
.nobc .chip[aria-pressed="true"] { background: #191414; color: #fff; }
.nobc { flex-wrap: wrap; }
.nobc .ph { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.nobc img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; display: block; }
.nobc label.chip { position: relative; overflow: hidden; }
.nobc input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.edb { margin-left: auto; border: 0; background: var(--soft); color: var(--ink); font: inherit; font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 99px; cursor: pointer; }
.edit { display: grid; gap: 8px; background: var(--soft); border-radius: 14px; padding: 10px; }
.edit input { background: var(--surface); }
.chint { justify-self: start; font-size: 12.5px; font-weight: 700; color: var(--kb); background: rgba(65,0,245,.08); border-radius: 99px; padding: 3px 10px; }
.sheet { display: grid; gap: 10px; }
.sheet img { width: 100%; border-radius: 12px; border: 1px solid var(--line); }
.bin { flex: 1; min-width: 0; padding: 4px 8px; font-size: 14px; font-family: var(--f-num); font-weight: 700; border-radius: 10px; }
.brow { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); }
.meta label { display: inline-flex; align-items: center; gap: 6px; }
.qin { width: 72px; padding: 4px 8px; font-size: 15px; font-family: var(--f-num); font-weight: 800; text-align: center; border-radius: 10px; }
.tag { font-size: 11.5px; font-weight: 700; border-radius: 99px; padding: 1px 8px; background: var(--go3); }
.tag.new { background: var(--cit); color: #191414; }
.prog { font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>

<div class="wrap">
  <header style="display:grid;gap:6px">
    <h1>倉庫點清</h1>
    <p class="muted">原本庫存表的東西都已經放進來了。選位置 → 一樣一樣核對；數量不對就直接改數字。表上沒有的東西再新增。做完按最下面「複製結果」貼 LINE。</p>
  </header>

  <section class="say" style="background:var(--cit);color:#191414;border-radius:18px;padding:14px 16px;display:grid;gap:4px">
    <b>分類怎麼選</b>
    <p>會拿來換給客人的東西，<b>一律選「禮品」</b>。禮品沒有 Barcode 的，要在那一樣按「拍照」。</p>
  </section>

  <section class="box" id="pick"></section>

  <section style="display:grid;gap:10px" id="shelf" hidden>
    <div class="shelf-h"><h2 id="shelfName"></h2><small id="shelfSum"></small></div>
    <div class="list" id="list"></div>
  </section>

  <section class="box" id="form" hidden>
    <h2>新增一樣</h2>
    <div class="g2">
      <label class="field">袋號<input id="fBag" type="number" inputmode="numeric" min="0"></label>
      <label class="field">數量<input id="fQty" type="number" inputmode="numeric" min="0"></label>
    </div>
    <label class="field">品名<input id="fName" placeholder="例：恐龍盲盒"></label>
    <label class="field">款式／系列<input id="fSer" placeholder="顏色、尺寸，沒有就空著"></label>
    <label class="field">Barcode<input id="fBc" inputmode="numeric" placeholder="沒有就空著"></label>
    <div class="field">分類<div class="cats" id="fCat"></div></div>
    <button class="btn" id="add" type="button">新增</button>
  </section>
</div>

<div class="wrap" style="padding-top:0"><section class="box sheet" id="exp" hidden>
    <h2>匯出給試算表</h2>
    <p class="muted">全部點完後，按「下載 CSV 檔」，把檔案用 LINE 傳到群組。</p>
    <div class="btns" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="csv" type="button">下載 CSV 檔</button><button class="btn" id="tsv" type="button" style="background:var(--ink);color:var(--bg)">複製表格</button></div>
    <p class="muted" style="font-size:13px">「複製表格」可以直接貼到 Google 試算表的空白分頁，會自動分好欄。</p>
  </section>
  <section class="box sheet" id="sheet">
    <h2>缺 Barcode 照片表</h2>
    <p class="muted" id="sheetInfo"></p>
    <button class="btn" id="mk" type="button">產生照片表</button>
    <div id="sheetOut" class="sheet"></div>
  </section>
  <button type="button" id="expLink" style="justify-self:center;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:4px 8px">匯出完整清單</button></div>

<div class="bar"><span>已點 <b id="total">0</b> 樣</span><button id="copy" type="button">複製結果，貼到 LINE</button></div>

      rs.filter(r => (done(r) && r.go !== '數量對') || ch(r).length || (needBc(r) && done(r))).forEach(r => { const x = ch(r); if (needBc(r) && done(r)) x.push('缺 Barcode' + (r.photo ? '，已拍照' : '，還沒拍照')); L.push('・' + (r.bag !== '' && r.bag != null ? '袋' + r.bag + '｜' : '') + r.name + (r.ser ? '（' + r.ser + '）' : '') + '｜' + r.go +
        (r.go === '數量不對' ? '：' + (r.q0 === '' ? '?' : r.q0) + ' → ' + (r.qty === '' ? '?' : r.qty) : r.go === '新找到' ? ' ×' + (r.qty === '' ? '?' : r.qty) : '') + (x.length ? '｜' + x.join('｜') : '')); }); });
    if (idle.length) L.push('', '還沒點：' + idle.join('、'));
    const txt = L.join('\n');
    try { await navigator.clipboard.writeText(txt); toast('已複製，去 LINE 貼上'); }
    catch (e) { const ta = el('textarea'); ta.value = txt; ta.style.cssText = 'width:100%;min-height:240px;font:inherit'; document.querySelector('.wrap').append(ta); ta.scrollIntoView(); ta.select(); toast('長按下面的文字複製'); }
  });
  const loadImg = u => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = u; });
  function drawSheetInfo() { const list = rows.filter(r => needBc(r) && done(r)); const withPic = list.filter(r => (r.pics || []).length);
    $('sheetInfo').textContent = list.length ? '已點過的禮品裡有 ' + list.length + ' 樣沒有 Barcode，已拍照 ' + withPic.length + ' 樣。按下面產生一張圖，長按存起來傳到 LINE。' : '目前沒有缺 Barcode 的禮品。'; $('mk').disabled = !list.length; }
  $('mk').addEventListener('click', async () => {
    const list = rows.filter(r => needBc(r) && done(r)).sort((a, b) => ORDER.indexOf(a.pos) - ORDER.indexOf(b.pos));
    const out = $('sheetOut'); out.innerHTML = ''; if (!list.length) return;
    const W = 1080, PER = 8, CW = 520, PH = 360, CH = PH + 150, PAD = 20;
    const d = new Date();
    for (let pg = 0; pg * PER < list.length; pg++) {
      const part = list.slice(pg * PER, pg * PER + PER); const rowsN = Math.ceil(part.length / 2);
      const c = document.createElement('canvas'); c.width = W; c.height = 110 + rowsN * (CH + PAD) + PAD; const g = c.getContext('2d');
      g.fillStyle = '#f4f4f4'; g.fillRect(0, 0, c.width, c.height);
      g.fillStyle = '#191414'; g.font = '900 40px "Noto Sans TC", sans-serif'; g.fillText('缺 Barcode 禮品　' + (d.getMonth() + 1) + '/' + d.getDate(), PAD + 6, 62);
      g.font = '700 26px "Noto Sans TC", sans-serif'; g.fillStyle = '#6f6a6a'; g.fillText('第 ' + (pg + 1) + ' 張／共 ' + Math.ceil(list.length / PER) + ' 張・' + list.length + ' 樣', PAD + 6, 98);
      for (let i = 0; i < part.length; i++) { const r = part[i]; const x = PAD + (i % 2) * (CW + PAD), y = 110 + Math.floor(i / 2) * (CH + PAD);
        g.fillStyle = '#ffffff'; g.fillRect(x, y, CW, CH);
        const u = (r.pics || [])[0] ? await getPic(r.pics[0]) : null; const im = u ? await loadImg(u) : null;
        if (im) { const s = Math.max(CW / im.width, PH / im.height); const sw = CW / s, sh = PH / s; g.drawImage(im, (im.width - sw) / 2, (im.height - sh) / 2, sw, sh, x, y, CW, PH); }
        else { g.fillStyle = '#efeded'; g.fillRect(x, y, CW, PH); g.fillStyle = '#ff4632'; g.font = '800 30px "Noto Sans TC", sans-serif'; g.fillText('還沒拍照', x + 180, y + PH / 2); }
        g.fillStyle = '#191414'; g.font = '800 30px "Noto Sans TC", sans-serif'; const nm = r.name + (r.ser ? '（' + r.ser + '）' : ''); g.fillText(nm.length > 16 ? nm.slice(0, 16) + '…' : nm, x + 16, y + PH + 48);
        g.font = '600 24px "Noto Sans TC", sans-serif'; g.fillStyle = '#6f6a6a';
        g.fillText(r.pos + (r.bag !== '' && r.bag != null ? '・袋 ' + r.bag : '') + '・數量 ' + (r.qty === '' ? '?' : r.qty), x + 16, y + PH + 90);
        if ((r.pics || []).length > 1) g.fillText('另有 ' + (r.pics.length - 1) + ' 張照片', x + 16, y + PH + 126); }
      const im = el('img'); im.alt = '缺 Barcode 照片表第 ' + (pg + 1) + ' 張'; im.src = c.toDataURL('image/jpeg', 0.85); out.append(im);
    }
    out.append(el('p', 'muted', '長按每一張圖 →「儲存圖片」或「分享」，傳到 LINE 群組。'));
  });
  const HEAD = ['位置', '袋號', '品名', '系列名', '原本數量', '複盤數量', '複盤結果', '分類', 'Barcode', '點數', '商品狀態', '照片', '原本品名', '原本系列名', '是否新找到'];
  const table = () => rows.slice().sort((a, b) => ORDER.indexOf(a.pos) - ORDER.indexOf(b.pos)).map(r => [r.pos, r.bag, r.name, r.ser, r.old ? r.q0 : '', r.qty, r.go === NONE ? '還沒點' : r.go, r.cat || '', r.bc || '', r.pts, r.st || '', (r.pics || []).length ? '已拍 ' + r.pics.length + ' 張' : (needBc(r) ? '缺 Barcode 未拍' : ''), r.old && r.name !== r.n0 ? r.n0 : '', r.old && (r.ser || '') !== (r.s0 || '') ? r.s0 : '', r.old ? '' : '是']);
  const cell = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  $('tsv').addEventListener('click', async () => { const txt = [HEAD, ...table()].map(r => r.map(v => String(v == null ? '' : v).replace(/[\t\n]/g, ' ')).join('\t')).join('\n');
    try { await navigator.clipboard.writeText(txt); toast('已複製，貼到試算表空白分頁'); } catch (e) { toast('複製不了，請用下載 CSV'); } });
  $('csv').addEventListener('click', async () => { const csv = '﻿' + [HEAD, ...table()].map(r => r.map(cell).join(',')).join('\r\n'); const d = new Date();
    const name = '倉庫複盤_' + (d.getMonth() + 1) + '月' + d.getDate() + '日.csv';
    let dl = null; try { dl = await window.claude?.use?.('downloads'); } catch (e) {}
    if (dl) { try { await dl.save({ filename: name, data: csv }); return; } catch (e) { if (e && e.code === 'declined') return; } }
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name; document.body.append(a); a.click(); a.remove(); }
    catch (e) { toast('下載不了，請用複製表格'); } });
  (async () => { try { const u = await window.claude?.use?.('user'); if (u && await u.isOwner()) $('exp').hidden = false; } catch (e) {} })();
  $('expLink').addEventListener('click', () => { $('exp').hidden = !$('exp').hidden; if (!$('exp').hidden) $('exp').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  drawSheetInfo();
  drawPick(); drawShelf();
})();
